apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "graphrag-conversation.fullname" . }}
  namespace: {{ include "graphrag-conversation.namespace" . }}
  labels:
    {{- include "graphrag-conversation.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
data:
  {{- if not (hasKey .Values.configuration.properties "spring.datasource.url") }}
  spring.datasource.url: {{ printf "jdbc:duckdb:%s/duckdb.db" (trimSuffix "/" .Values.persistence.path) }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.properties "graphdb.endpoint") }}
  graphdb.endpoint: {{ .Values.configuration.graphdb.url }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.properties "graphdb.auth.type") }}
  graphdb.auth.type: {{ .Values.configuration.graphdb.auth.type }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.properties "elasticsearch.url") }}
  elasticsearch.url: {{ .Values.configuration.elasticsearch.url }}
  {{- end }}
  JAVA_OPTS: >-
    {{ tpl .Values.configuration.defaultJavaArguments . }}
    {{ tpl .Values.configuration.javaArguments . }}
  {{- if .Values.configuration.properties -}}
    {{- range $key, $value := .Values.configuration.properties -}}
      {{- if ne $value nil -}}
        {{- printf "%s: %s" $key (tpl ($value | toString) $ | quote) | nindent 2 -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
