apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "graphrag-evaluation.fullname" . }}
  namespace: {{ include "graphrag-evaluation.namespace" . }}
  labels:
    {{- include "graphrag-evaluation.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
data:
  {{- if .Values.configuration.properties -}}
    {{- range $key, $value := .Values.configuration.properties -}}
      {{- if ne $value nil -}}
        {{- printf "%s: %s" $key (tpl ($value | toString) $ | quote) | nindent 2 -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
