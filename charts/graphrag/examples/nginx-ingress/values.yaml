chatbot:
  ingress:
    enabled: true
    className: nginx
    annotations:
      # 30 minutes
      nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    pathType: Prefix

workflows:
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    path: /graphrag/workflows(/|$)(.*)
    pathType: ImplementationSpecific
