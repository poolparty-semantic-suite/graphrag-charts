#
# Sample PostgreSQL database for Keycloak.
# See https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/
#
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: graphrag-keycloak-postgres
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 1Gi
