#
# Sample PostgreSQL cluster for the GraphRAG Workflows service.
# See https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/
#
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: graphrag-workflows-postgres
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: graphrag
      owner: graphrag
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 1Gi
